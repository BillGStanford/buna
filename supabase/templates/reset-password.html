<!-- Supabase → Authentication → Email Templates → "Reset password". Subject: Reset your Buna password -->
<h2>Reset your Buna password</h2>
<p>We received a request to reset your password. This link works once and expires in an hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Choose a new password</a></p>
<p>If you didn’t ask for this, you can ignore this email — your password won’t change.</p>
